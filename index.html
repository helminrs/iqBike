<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TatanggaQ - Pesan Q-Ride & Q-Rim</title>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8cc63f">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- MapLibre GL CSS & JS (Peta Vektor Modern ala inDrive, Cepat & Gratis) -->
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            /* Tema Default / Q-Ride (Hijau ala inDrive) */
            --primary-color: #8cc63f;
            --primary-hover: #7ab332;
            --theme-glow: rgba(140, 198, 63, 0.3);
            
            --bg-dark: #121212;
            --text-light: #ffffff;
            --text-dark: #222222;
            --bg-body: #f4f5f7;
            --border-color: #e0e0e0;
            --accent-red: #eb5757;
            --whatsapp-green: #25D366;
        }

        /* Tema Khusus Q-Rim (Biru Persib) */
        body.theme-qrim {
            --primary-color: #0047AB; /* Biru Persib */
            --primary-hover: #003380;
            --theme-glow: rgba(0, 71, 171, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #ffffff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }

        /* Header Aplikasi */
        .app-header {
            background-color: var(--primary-color);
            color: var(--text-light);
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .app-title {
            font-size: 1.2rem;
            font-weight: 700;
        }

        /* Pilihan Layanan (Tab Switcher) */
        .service-selector {
            display: flex;
            background: #ffffff;
            padding: 10px 16px;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .service-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: #f9f9f9;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #555;
        }

        .service-btn.active {
            border-color: var(--primary-color);
            background: var(--primary-color);
            color: var(--text-light);
        }

        /* Area Konten / Peta */
        .content-area {
            flex: 1;
            position: relative;
            display: flex;
            flex-direction: column;
        }

        #map {
            width: 100%;
            height: 100%;
            flex: 1;
        }

        /* Panel Bawah (Form Pemesanan) */
        .order-panel {
            background: #ffffff;
            padding: 20px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .action-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: var(--text-light);
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px var(--theme-glow);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <div class="app-header">
            <div class="app-title"><i class="fa-solid fa-house-chimney"></i> TatanggaQ</div>
            <div id="active-service-label">Q-Ride</div>
        </div>

        <!-- Tombol Pilih Layanan (Q-Ride vs Q-Rim) -->
        <div class="service-selector">
            <button class="service-btn active" id="btn-qride" onclick="switchService('qride')">
                <i class="fa-solid fa-motorcycle"></i> Q-Ride
            </button>
            <button class="service-btn" id="btn-qrim" onclick="switchService('qrim')">
                <i class="fa-solid fa-box-archive"></i> Q-Rim
            </button>
        </div>

        <!-- Area Peta & Konten -->
        <div class="content-area">
            <div id="map"></div>
        </div>

        <!-- Panel Pesan -->
        <div class="order-panel">
            <button class="action-btn" id="order-action-btn">Pesan Q-Ride Sekarang</button>
        </div>
    </div>

    <script>
        // Fungsi untuk Mengubah Tema & Layanan secara Dinamis
        function switchService(service) {
            const body = document.body;
            const btnQRide = document.getElementById('btn-qride');
            const btnQRim = document.getElementById('btn-qrim');
            const serviceLabel = document.getElementById('active-service-label');
            const actionBtn = document.getElementById('order-action-btn');

            if (service === 'qride') {
                // Aktifkan Tema Q-Ride (Hijau inDrive)
                body.classList.remove('theme-qrim');
                btnQRide.classList.add('active');
                btnQRim.classList.remove('active');
                serviceLabel.innerText = 'Q-Ride';
                actionBtn.innerText = 'Pesan Q-Ride Sekarang';
            } else {
                // Aktifkan Tema Q-Rim (Biru Persib)
                body.classList.add('theme-qrim');
                btnQRim.classList.add('active');
                btnQRide.classList.remove('active');
                serviceLabel.innerText = 'Q-Rim';
                actionBtn.innerText = 'Kirim Paket dengan Q-Rim';
            }
        }

        // Inisialisasi Peta MapLibre GL (Contoh Tampilan Dasar)
        // Ganti style URL dengan style peta vektor pilihan Anda (misal MapTiler / OpenFreeMap)
        const map = new maplibregl.Map({
            container: 'map',
            style: 'https://demotiles.maplibre.org/style.json', // Contoh style dasar
            center: [107.57, -7.03], // Koordinat wilayah sekitar (Banjaran/Bandung Raya)
            zoom: 13
        });
    </script>
</body>
</html>
