<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iqBike - Pesan Ojek & Kurir Cepat</title>

    <!-- PWA SETTINGS -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#8cc63f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="iqBike">
    <!-- Pastikan Anda memiliki ikon 192x192 dan 512x512 di folder Anda -->

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        /* (CSS Anda tetap sama seperti yang Anda berikan) */
        :root { --bg-dark: #121212; --primary-green: #8cc63f; --primary-green-hover: #7ab332; --text-light: #ffffff; --text-dark: #222222; --bg-body: #f4f5f7; --border-color: #e0e0e0; --accent-red: #eb5757; --accent-blue: #0288d1; --whatsapp-green: #25D366; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-body); color: var(--text-dark); display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        .app-container { width: 100%; max-width: 480px; background-color: #ffffff; height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 15px rgba(0,0,0,0.1); position: relative; overflow: hidden; }
        /* ... tambahkan kembali semua CSS Anda di sini ... */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(18, 18, 18, 0.95); z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; color: white; text-align: center; }
        .login-card { background: #222; padding: 24px; border-radius: 16px; width: 100%; max-width: 400px; border: 1px solid #333; display: flex; flex-direction: column; gap: 16px; }
        .header { background-color: var(--bg-dark); color: var(--text-light); padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; }
        .map-wrapper { position: relative; width: 100%; flex: 1; min-height: 240px; background-color: #e5e3df; border-radius: 10px; overflow: hidden; }
        #map { width: 100%; height: 100%; }
        /* Pastikan CSS lainnya Anda masukkan kembali lengkap di sini */
    </style>
</head>
<body>

<div class="app-container">
    <!-- (Konten HTML modal dan UI Anda di sini) -->
    <header class="header">
        <div class="brand-title"><i class="fa-solid fa-motorcycle" style="color: var(--primary-green);"></i> <span>iqBike</span></div>
        <div class="header-actions"><button class="btn-header-install" onclick="triggerPwaInstallPrompt()"><i class="fa-solid fa-download"></i> Install</button></div>
    </header>

    <main class="content-area">
        <!-- (Konten main, form, dll) -->
        <div id="passengerMapWrapper" class="map-wrapper"></div>
    </main>
</div>

<div id="masterMapElement" style="display:none; width:100%; height:100%;">
    <div id="map" style="width:100%; height:100%;"></div>
    <!-- (Tombol-tombol peta) -->
</div>

<script>
    // Inisialisasi Firebase & PWA
    const firebaseConfig = { /* ... config Anda ... */ };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // Fungsi utama dipanggil saat window benar-benar siap
    window.addEventListener('load', function() {
        initMap();
        updatePassengerAppUI();
        renderPassengerHistory();
    });

    function initMap() {
        const masterEl = document.getElementById('masterMapElement');
        const targetContainer = document.getElementById('passengerMapWrapper');
        if (targetContainer && masterEl) {
            targetContainer.appendChild(masterEl);
            masterEl.style.display = 'block';
        }
        
        map = L.map('map', { zoomControl: false }).setView([-7.02443, 107.58556], 16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        // ... (lanjutan logika map Anda)
    }

    // ... (Masukkan kembali semua fungsi logika JS Anda di sini)
</script>
</body>
</html>
